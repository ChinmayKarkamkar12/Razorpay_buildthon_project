<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recovery Coordinator{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e8ec; --mut:#9aa4b2;
            --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
           background:var(--bg); color:var(--fg); }
    header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex;
             gap:20px; align-items:baseline; }
    header h1 { font-size:16px; margin:0; }
    header a { color:var(--mut); text-decoration:none; margin-right:14px; }
    header a:hover { color:var(--fg); }
    main { padding:24px; max-width:1000px; margin:0 auto; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
    .card .n { font-size:26px; font-weight:600; }
    .card .k { color:var(--mut); font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
    th { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    tr:hover td { background:#1c202a; }
    a.row-link { color:var(--info); text-decoration:none; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
    .s-recovered { background:rgba(63,185,80,.15); color:var(--ok); }
    .s-halted { background:rgba(210,153,34,.15); color:var(--warn); }
    .s-escalated { background:rgba(248,81,73,.15); color:var(--bad); }
    .s-pending { background:rgba(88,166,255,.15); color:var(--info); }
    .pager { margin-top:16px; display:flex; gap:10px; align-items:center; }
    .pager a, .filters a { color:var(--info); text-decoration:none; padding:4px 10px;
             border:1px solid var(--line); border-radius:6px; }
    .filters { margin:12px 0; display:flex; gap:8px; flex-wrap:wrap; }
    .filters a.active { background:var(--info); color:#0b0d10; border-color:var(--info); }
    .story li { margin:6px 0; }
    .muted { color:var(--mut); }
    .substatus { color:var(--mut); font-size:12.5px; margin-top:4px; }
    .callout { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--info);
               border-radius:0 10px 10px 0; padding:12px 16px; }
    abbr[title] { text-decoration:underline dotted; text-decoration-color:var(--mut);
                  cursor:help; }
    details { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; }
    details[open] { padding-bottom:16px; }
    details summary { cursor:pointer; }
    details summary::marker { color:var(--mut); }
    details table { margin-top:12px; }
    .progress-wrap { height:8px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:6px; }
    .progress-bar { height:100%; background:var(--info); width:0; transition:width .4s; }
    pre { background:#0b0d10; border:1px solid var(--line); padding:12px; border-radius:8px;
          overflow:auto; font-size:12px; color:var(--mut); }
  </style>
</head>
<body>
  <header>
    <h1>RBI E-Mandate Recovery Coordinator</h1>
    <nav>
      <a href="/">Summary</a>
      <a href="/transactions">Transactions</a>
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
